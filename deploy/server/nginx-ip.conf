limit_req_zone $binary_remote_addr zone=karries_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=karries_login:10m rate=5r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 220m;
    access_log /var/log/nginx/karries-access.log;
    error_log /var/log/nginx/karries-error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob: https://d8j0ntlcm91z4.cloudfront.net; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'" always;

    root /var/www/karries/customer;
    index index.html;

    location ~ ^/api/auth/(customer|manager|developer)/login$ {
        limit_req zone=karries_login burst=5 nodelay;
        include proxy_params;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        limit_req zone=karries_api burst=40 nodelay;
        include proxy_params;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /manager/ {
        alias /var/www/karries/manager/;
        try_files $uri $uri/ /manager/index.html;
    }

    location /developer/ {
        alias /var/www/karries/developer/;
        try_files $uri $uri/ /developer/index.html;
    }

    location ~* ^/(?:assets/.*|[^/]+\.(?:css|js|png|jpg|jpeg|webp|svg|woff2?))$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
