[project]
name = "xiaohongshu-publisher-backend"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "pydantic==2.10.4",
  "python-multipart==0.0.20",
  "loguru==0.7.3",
  "opencv-python>=4.13.0.92",
  "patchright==1.58.2",
  "qrcode==8.2",
  "requests==2.32.3",
  "cryptography==43.0.3",
  "segno>=1.6.6",
  "PyMySQL==1.1.1"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "httpx==0.28.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
