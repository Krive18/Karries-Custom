[project]
name = "xiaohongshu-publisher-backend"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.34.0",
  "pydantic==2.10.4",
  "python-multipart==0.0.31",
  "loguru==0.7.3",
  "opencv-python>=4.13.0.92",
  "patchright==1.58.2",
  "qrcode==8.2",
  "requests==2.33.0",
  "cryptography==50.0.0",
  "segno>=1.6.6",
  "PyMySQL==1.1.1",
  "lark-channel-sdk==1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "httpx==0.28.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
